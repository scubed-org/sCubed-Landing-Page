<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Team Layouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Values copied from apps/web/src/styles/tokens.css.ts and OurTeam/styles.css.ts */
  :root {
    --brand: #7a7eed;
    --p100: #ede9fe;
    --p200: #ddd6fe;
    --p500: #8b5cf6;
    --p700: #6d28d9;
    --n100: #f4f4f5;
    --n200: #e4e4e7;
    --n600: #52525b;
    --n900: #18181b;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--n100); color: var(--n900); font-family: var(--font); }

  /* Comparison controls: deliberately neutral so they read as separate from the page */
  .bar {
    position: sticky; top: 0; z-index: 10;
    background: #fff; border-bottom: 1px solid var(--n200);
    padding: 12px 16px;
  }
  .bar-row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
  .group { display: flex; flex-wrap: wrap; gap: 4px; }
  .bar button {
    font: 500 14px/1 var(--font); color: var(--n900);
    background: transparent; border: 1px solid transparent; border-radius: 6px;
    padding: 9px 12px; cursor: pointer;
  }
  .bar button:hover { background: var(--n100); }
  .bar button[aria-pressed="true"] { background: var(--n900); color: #fff; }
  .bar button:focus-visible, .read-more:focus-visible { outline: 2px solid var(--p700); outline-offset: 2px; }
  .caption { margin: 10px 0 0; font-size: 14px; line-height: 1.5; color: var(--n600); max-width: 80ch; }

  .canvas { padding: 16px; overflow-x: auto; }
  .stage { background: #fff; margin: 0 auto; }
  .stage.desktop { width: 1280px; }
  .stage.mobile { width: 390px; border: 1px solid var(--n200); border-radius: 16px; overflow: hidden; }

  /* Section, matching the live page */
  .section { padding: 48px 24px; }
  .stage.mobile .section { padding: 32px 20px; }
  .content { max-width: 72rem; margin: 0 auto; }
  h2 { font-size: 1.75rem; font-weight: 700; text-align: center; margin: 0 0 1rem; color: var(--n900); }
  .stage.mobile h2 { font-size: 1.5rem; margin-bottom: .5rem; }
  h2 span { color: var(--brand); }
  .sub { font-size: 1.125rem; color: var(--n600); text-align: center; max-width: 48rem; margin: 0 auto; padding-bottom: 3rem; }
  .stage.mobile .sub { font-size: 1rem; padding-bottom: 2rem; }

  .team { display: grid; gap: 2rem; }

  .card {
    display: grid;
    background: linear-gradient(135deg, #ffffff 0%, #fafbff 100%);
    border: 1px solid rgba(122, 126, 237, .08);
    border-radius: 1rem;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .08);
    padding: 1rem;
    gap: 1rem;
    grid-template-areas: "photo" "head" "bio";
    transition: box-shadow .3s ease, border-color .3s ease;
  }
  .card:hover { box-shadow: 0 20px 60px rgba(122, 126, 237, .2); border-color: var(--p200); }
  .photo {
    grid-area: photo; justify-self: center;
    width: 120px; height: 120px; border-radius: 9999px; overflow: hidden;
    border: 4px solid var(--p100); box-shadow: 0 4px 20px rgba(122, 126, 237, .15);
  }
  .photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .head { grid-area: head; text-align: center; }
  .name { margin: 0 0 .5rem; font-size: 1.25rem; font-weight: 700; color: var(--brand); }
  .role { margin: 0; font-size: .875rem; font-weight: 500; color: var(--p500); }
  .bio { grid-area: bio; margin: 0; font-size: .875rem; line-height: 1.75; color: var(--n600); }
  .read-more {
    background: none; border: 0; padding: 0; margin-left: 4px; cursor: pointer;
    color: var(--p500); font: inherit; font-weight: 600;
  }
  .read-more:hover { color: var(--p700); text-decoration: underline; }

  /* Desktop layouts. Mobile is the shared base above. */
  .desktop .card { padding: 2rem; column-gap: 2.5rem; row-gap: .75rem; }
  .desktop .head { text-align: left; align-self: end; }
  .desktop .bio { align-self: start; }

  /* 1: stacked, photo on the left */
  .desktop .l1 .card { grid-template-columns: 160px minmax(0, 1fr); grid-template-areas: "photo head" "photo bio"; }
  .desktop .l1 .photo { width: 160px; height: 160px; align-self: center; }
  .desktop .l1 .bio { font-size: 1rem; line-height: 1.7; max-width: 52rem; }

  /* 2: alternating stack, larger photos */
  .desktop .l2 .card { padding: 2.5rem 3rem; grid-template-columns: 240px minmax(0, 1fr); grid-template-areas: "photo head" "photo bio"; }
  .desktop .l2 .card:nth-child(even) { grid-template-columns: minmax(0, 1fr) 240px; grid-template-areas: "head photo" "bio photo"; }
  .desktop .l2 .photo { width: 240px; height: 240px; align-self: center; }
  .desktop .l2 .name { font-size: 1.5rem; }
  .desktop .l2 .bio { font-size: 1rem; line-height: 1.7; }

  /* 3: Stephanie on top, two below */
  .desktop .l3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .desktop .l3 .card { grid-template-columns: 100px minmax(0, 1fr); grid-template-rows: auto 1fr; grid-template-areas: "photo head" "bio bio"; column-gap: 1.25rem; row-gap: 1.25rem; }
  .desktop .l3 .photo { width: 100px; height: 100px; }
  .desktop .l3 .head { align-self: center; }
  .desktop .l3 .name { font-size: 1.125rem; }
  .desktop .l3 .card:first-child { grid-column: 1 / -1; grid-template-columns: 160px minmax(0, 1fr); grid-template-rows: none; grid-template-areas: "photo head" "photo bio"; column-gap: 2.5rem; row-gap: .75rem; }
  .desktop .l3 .card:first-child .photo { width: 160px; height: 160px; align-self: center; }
  .desktop .l3 .card:first-child .head { align-self: end; }
  .desktop .l3 .card:first-child .name { font-size: 1.25rem; }
  .desktop .l3 .card:first-child .bio { font-size: 1rem; line-height: 1.7; max-width: 52rem; }

  /* 4: three columns */
  .desktop .l4 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .desktop .l4 .card { grid-template-rows: auto auto 1fr; row-gap: 1rem; padding: 1.75rem; }
  .desktop .l4 .photo { width: 120px; height: 120px; }
  .desktop .l4 .head { text-align: center; align-self: start; }
  .desktop .l4 .name { font-size: 1.125rem; }

  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
  <div class="bar">
    <div class="bar-row">
      <div class="group" id="layouts" role="group" aria-label="Layout"></div>
      <div class="group" id="views" role="group" aria-label="Screen size"></div>
    </div>
    <p class="caption" id="caption" aria-live="polite"></p>
  </div>
  <div class="canvas">
    <div class="stage desktop" id="stage">
      <section class="section">
        <div class="content">
          <h2>Meet Our <span>Expert Team</span></h2>
          <p class="sub">Passionate professionals dedicated to transforming healthcare delivery</p>
          <div class="team l1" id="team"></div>
        </div>
      </section>
    </div>
  </div>

      bio: "Stephanie is a dedicated leader and Board Certified Behavior Analyst (BCBA) with a passion for building innovative and compassionate services for individuals and families. With a Master's degree in Education and extensive experience in applied behavior analysis, she has spent her career driving meaningful change in the field. As CEO and President, Stephanie combines clinical expertise with visionary leadership, ensuring that the organization delivers high-quality care while fostering a culture of growth and collaboration. Guided by both professional dedication and personal commitment, she continues to shape programs that empower families and create lasting impact." },

      bio: "Uroosa holds a Master’s degree in Applied Behavior Analysis and has a background in clinical practice, behavioral health, and healthcare technology. With experience as a Registered Behavior Technician and in client support, she brings an understanding of the challenges providers face and the importance of having the right tools and resources. She is passionate about supporting the ABA community, improving everyday workflows, and helping make technology more accessible and useful for practitioners and families." }
  ];

  var layouts = [
    { id: "l1", label: "1. Stacked, photo left", note: "Every card is full width. The photo sits beside the text, so there is no empty space next to it." },
    { id: "l2", label: "2. Alternating stack", note: "Every card is full width, with larger photos that switch sides down the page. This takes the most scrolling." },
    { id: "l3", label: "3. Stephanie on top", note: "Stephanie gets a full-width card, and Jace and Uroosa sit side by side below. Only one card is full width." },
    { id: "l4", label: "4. Three columns", note: "All three fit in one row with the least scrolling. Columns are narrow, and Stephanie's longer bio leaves the other two cards with empty space." }
  ];

  var state = { layout: "l1", view: window.innerWidth < 600 ? "mobile" : "desktop", open: {} };
  var team = document.getElementById("team"), stage = document.getElementById("stage");
  var caption = document.getElementById("caption");
  var layoutsEl = document.getElementById("layouts"), viewsEl = document.getElementById("views");

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function buildBio(m) {
    var p = el("p", "bio");
    var words = m.bio.trim().split(/\s+/);
    var cut = state.view === "mobile" && words.length > WORD_LIMIT;
    if (!cut) { p.textContent = m.bio; return p; }
    var open = !!state.open[m.name];
    p.appendChild(document.createTextNode(open ? m.bio : words.slice(0, WORD_LIMIT).join(" ") + "..."));
    var b = el("button", "read-more", open ? "Read less" : "Read more");
    b.type = "button";
    b.addEventListener("click", function () { state.open[m.name] = !open; render(); });
    p.appendChild(b);
    return p;
  }

  function buildCard(m) {
    var card = el("article", "card");
    var photo = el("div", "photo");
    var img = el("img");
    img.src = m.img;
    img.alt = m.name + " - " + m.title;
    photo.appendChild(img);
    var head = el("div", "head");
    head.appendChild(el("h3", "name", m.name));
    head.appendChild(el("p", "role", m.title));
    card.appendChild(photo);
    card.appendChild(head);
    card.appendChild(buildBio(m));
    return card;
  }

  function fit() {
    // Scale the desktop preview down to fit a narrow window instead of switching it to mobile.
    var available = document.documentElement.clientWidth - 32;
    stage.style.zoom = state.view === "desktop" ? Math.min(1, available / 1280) : 1;
  }

  function render() {
    stage.className = "stage " + state.view;
    team.className = "team " + state.layout;
    team.replaceChildren.apply(team, members.map(buildCard));
    var current = layouts.filter(function (l) { return l.id === state.layout; })[0];
    caption.textContent = current.note + (state.view === "mobile" ? MOBILE_NOTE : "");
    Array.prototype.forEach.call(layoutsEl.children, function (b) { b.setAttribute("aria-pressed", String(b.dataset.id === state.layout)); });
    Array.prototype.forEach.call(viewsEl.children, function (b) { b.setAttribute("aria-pressed", String(b.dataset.id === state.view)); });
    fit();
  }

  function addButton(parent, id, label, key) {
    var b = el("button", "", label);
    b.type = "button";
    b.dataset.id = id;
    b.addEventListener("click", function () { state[key] = id; render(); });
    parent.appendChild(b);
  }

  layouts.forEach(function (l) { addButton(layoutsEl, l.id, l.label, "layout"); });
  addButton(viewsEl, "desktop", "Desktop", "view");
  addButton(viewsEl, "mobile", "Mobile", "view");
  window.addEventListener("resize", fit);
  render();
</script>
